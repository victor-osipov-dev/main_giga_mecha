[workspace]
resolver = "2"
members = [
    "crates/arcade-protocol",
    "crates/arcade-protocol-data",
    "crates/arcade-auth",
    "crates/arcade-players",
    "crates/arcade-world",
    "crates/arcade-network",
    "crates/arcade-runtime",
    "crates/arcade-render",
    "crates/arcade-metrics",
    "crates/arcade-server",
    "games/flappy-bird",
    "games/mech-wars",
    "tools/test-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/voxel-arcade-rs"

[workspace.dependencies]
arcade-protocol = { path = "crates/arcade-protocol" }
arcade-protocol-data = { path = "crates/arcade-protocol-data" }
arcade-auth = { path = "crates/arcade-auth" }
arcade-players = { path = "crates/arcade-players" }
arcade-world = { path = "crates/arcade-world" }
arcade-network = { path = "crates/arcade-network" }
arcade-runtime = { path = "crates/arcade-runtime" }
arcade-render = { path = "crates/arcade-render" }
arcade-metrics = { path = "crates/arcade-metrics" }
flappy-bird = { path = "games/flappy-bird" }
mech-wars = { path = "games/mech-wars" }

aes = "0.9.3"
anyhow = "1.0.104"
bytes = "1.12.1"
cfb8 = "0.9.1"
flate2 = "1.1.10"
minecraft_data = "=4.2.0"
num-bigint = "0.5.1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v3", "v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
